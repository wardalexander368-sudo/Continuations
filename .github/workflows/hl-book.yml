# Hyperliquid execution costs: spread and market-order slippage from the public L2 book of every
# perp with >= $500k 24h volume, every 2 hours (handoff/experiments/edge-hunt/perps/hl_book_costs.py).
# Public data only: no wallet, no keys, nothing traded.
name: hl-book

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hl-book-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.25"
      - run: |
          line=$(python3 handoff/experiments/edge-hunt/perps/hl_book_costs.py | tee /dev/stderr)
          git config user.name "tartar-paper-tests"
          git config user.email "actions@users.noreply.github.com"
          git add -f handoff/data/edge-hunt/hl-book
          git commit -m "HL book costs (hl-book action): $line"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
