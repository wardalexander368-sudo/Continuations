# Open interest / funding snapshots of every Hyperliquid perp (perps lane): the public API keeps no
# OI history, so OI-based rules need our own record. Also appends HL 1h candles for the wick-bounce
# pre-registration (the candle API keeps only ~5,000 bars). Public data only: no wallet, no keys.
name: perps-ctx

on:
  schedule:
    - cron: "52 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perps-ctx-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a hung job stops here instead of holding a runner for the 6 h default
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.25" "numpy>=1.24"  # wick_forward.py imports numpy
      - run: |
          line=$(python3 handoff/experiments/edge-hunt/perps/hl_ctx_snapshot.py | tee /dev/stderr)
          python3 handoff/experiments/edge-hunt/perps/wick_forward.py --update || echo "::warning::wick_forward.py --update failed; the wick test's 1h cache did not grow"
          git config user.name "tartar-paper-tests"
          git config user.email "actions@users.noreply.github.com"
          git add -f handoff/data/edge-hunt/hl-ctx handoff/data/edge-hunt/hl-1h
          git commit -m "Perps OI snapshot (perps-ctx action): $line"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
